<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krilyon AI</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="header">
        <h1>🤖 Krilyon AI</h1>
        <p>Always ready to help.</p>
    </header>

    <main id="chat" class="chat">

        <div class="bot">
            Salam! Mən <b>Krilyon AI</b>. 😊
            <br><br>
            Mənə istədiyin sualı ver.
        </div>

    </main>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Ask..."
        >

        <button id="send">
            Göndər
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html><style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#121212;
    color:white;
}

.app{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.header{
    background:#1f1f1f;
    text-align:center;
    padding:20px;
    border-bottom:1px solid #333;
}

.header h1{
    font-size:28px;
}

.header p{
    color:#bdbdbd;
    margin-top:5px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.bot,
.user{
    max-width:80%;
    padding:12px;
    border-radius:15px;
    margin-bottom:12px;
    line-height:1.5;
    word-wrap:break-word;
}

.bot{
    background:#2c2c2c;
    align-self:flex-start;
}

.user{
    background:#2e7d32;
    margin-left:auto;
}

.input-area{
    display:flex;
    padding:10px;
    background:#1f1f1f;
    border-top:1px solid #333;
}

#message{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

#send{
    margin-left:10px;
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:16px;
    font-weight:bold;
}</style><script>const chat = document.getElementById("chat");
const input = document.getElementById("message");
const send = document.getElementById("send");

// Buraya Cloudflare Worker linkini yazacağıq
const SERVER_URL = "https://krilyon-ai.cesursadatov9.workers.dev";

function addMessage(text, isUser) {
    const div = document.createElement("div");

    div.className = isUser ? "user" : "bot";
    div.innerHTML = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

send.onclick = async () => {

    const text = input.value.trim();

    if (!text) return;

    addMessage(text, true);

    input.value = "";

    try {

        const response = await fetch(SERVER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                messages: [
                    {
                        role: "user",
                        content: text
                    }
                ]
            })
        });

        const data = await response.json();

        const answer =
            data.choices?.[0]?.message?.content ||
            "Cavab alınmadı.";

        addMessage(answer, false);

    } catch (e) {

        addMessage("❌ Serverə qoşulmaq olmadı.", false);

    }

};

input.addEventListener("keydown", function(e){

    if(e.key==="Enter"){
        send.click();
    }

});</script>
